; KCD DLSS settings, read at game start. Delete a line to get its default.
; More (advanced) settings: see README.txt, "ADVANCED SETTINGS".

; DLSS mode: UltraQuality, Quality, Balanced, Performance, UltraPerformance or Native (= DLSS off).
; The DLSS row in the game's Graphics Settings writes this line.
Mode = Performance

; DLSS model: Transformer (the DLSS 310 model), CNN (the older DLSS 3 look) or Default (the DLSS file decides).
Preset = Transformer

; DLSS sharpening, 0.0 to 1.0.
Sharpness = 0

; Texture detail. NVIDIA and AMD recommend -1.0, Intel 0. Closer to 0 = softer textures, less shimmer.
MipBiasOffset = -1.0

; 1 = global illumination at a third of the render size on every graphics preset, with a shorter, wider light cone
; (the game uses 1/3 to 1/8, which shows as blocky shading at DLSS render sizes). Costs some GPU time on the lower
; presets. 0 = the game's own values. Console: r_DLSSGI 0 or 1.
; On a Steam Deck the mod sets this to 0 at its first start, once (it adds the line SteamDeckDefaults = 1 as its
; mark). After that the value is yours.
GIFullRes = 1

; 1 = smooth outline of the character in the inventory. 0 = the game's own blocky outline.
InventoryFix = 1
