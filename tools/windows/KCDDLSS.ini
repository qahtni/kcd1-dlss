; KCD DLSS plugin settings (read once at game start). 1 = on, 0 = off.
MipBias = 1
; object motion vectors from the game's velocity buffer
ObjectMV = 1
; hair and beards (0.8.2): they report only part of the head's motion, which made them wobble. Each such pixel takes the motion of
; the solid pixels within this many pixels. -1 = automatic (3, or 4 above 900 render lines), 0 = off, 1-4 = fixed.
VelocityDilate = -1
; 1 = keep the game's saved resolution at the output size (no low-resolution start, right value in Settings). 0 = off.
SaveOutputRes = 1
; blue-frame diagnostic probe (spike log + up to 4 .ppm dumps next to the plugin). Debug build (KCDDLSS-debug.asi) only;
; the release build ignores it.
Probe = 1
; DLSS mode: -1 auto from the resolution ratio, 0 Performance, 1 Balanced, 2 Quality, 3 UltraPerformance, 4 UltraQuality, 5 DLAA
Quality = -1
; DLSS mode (0.6.0): UltraQuality (0.7.4: 0.83 render scale), Quality, Balanced, Performance, UltraPerformance, Native (= DLSS off, the game renders at native size). Auto is gone in 0.8.2 (it starts as Quality). Old text: Auto (= keep the game's own resolution; then Quality above
; picks the DLSS quality value). The plugin sets r_Width/r_Height for the mode at NVIDIA's factors (1.0 / 1.5 / 1.72 / 2.0 / 3.0,
; from the NGX optimal-settings callback); live: tools/windows/kcdcon.sh 'mode Quality'
Mode = Performance
; DLSS render preset: Transformer (K, M for Performance, L for UltraPerformance = the DLSS 310 defaults), CNN (E, F = the DLSS 3 look),
; Default (the DLL decides) or one letter E..O for every mode; live: 'preset CNN'
Preset = Transformer
; texture mip bias = log2(render/native) + MipBiasOffset (needs MipBias = 1). NVIDIA and AMD recommend -1.0, Intel 0; UI/post passes
; (native-sized targets) are not biased. Live: 'mipbias -0.5', 'mipbias off', 'mipbias on'. 'dump' saves KCDDLSS_in.ppm/_out.ppm.
MipBiasOffset = -1.0
; black-out of the 3D view (UI stays) for this many ms on a mode switch (half on a preset switch), hiding the resize and the eye-adaptation
; restart. 0 = off (default since 0.7.1: the options menu fades by itself). Live: 'black 3000' (ms), 'black 0' cancels, 'blink 30' test.
BlackMs = 0
; 0.6.5: Prereq = 1 forces what DLSS needs at start and whenever the game's profile puts its own values back (settings menu):
; r_FullscreenNativeRes 1, r_AntialiasingMode 0 (DLSS replaces the TAA), r_MotionVectors 1, r_MotionBlurGBufferVelocity 1.
; No user.cfg needed. 0 = you manage these yourself.
Prereq = 1
; GIFullRes = 1 runs the SVOGI cone tracing at the render resolution (e_svoTI_ResScaleBase 1; the game uses half, which at
; DLSS Performance is a quarter of native and gets upscaled twice). Costs some GPU time. 0 = the game's half resolution.
GIFullRes = 1
; NgxDll (0.6.9): file in Bin\Win64 to use as the upscaler provider instead of the NVIDIA NGX core, e.g. NgxDll = OptiScaler.dll
; (OptiScaler gives FSR 3.1 / FSR 4 / XeSS on AMD, Intel and NVIDIA; see OPTISCALER.txt). Empty = NVIDIA DLSS through the driver.
NgxDll =
; DLSS sharpness 0.0 .. 1.0
Sharpness = 0
; bisect switches (0.4.6): Jitter = patch the game to jitter its camera (DLSS needs it); VelocityPatch = 16-bit velocity buffer;
; DLSS = run the DLSS pass at all (0 = plugin loaded, patches applied, picture is the game's own upscale)
Jitter = 1
VelocityPatch = 1
DLSS = 1
; Exec = console cvars applied by the plugin at frame 3, after the game profile (which overrides user.cfg for e.g. r_ColorGrading);
; format "name value; name value", logged with before/after values. Example: Exec = r_ColorGrading 0; r_SunShafts 0
; Blue flash = the WaterRipples post effect (confirmed live 2026-11-08 13:05). fxoff/fxon Name switch one game FX effect
; (vtable swap, Preprocess -> false). fxwrap Name keeps the effect and restores the render state after its Render
; (the ripple hit pass leaves "additive, blue-only write" set). 0.5.1 test: fxwrap. Fallback: Exec = fxoff WaterRipples
Exec = fxwrap WaterRipples
